{
  "dataset": {
    "name": "mta_subway",
    "adapter": "csv_long",
    "raw_dir": "data/raw/MTA_monthly",
    "file_glob": "MTA_Subway_*.csv",
    "freq": "1h",
    "timestamp_column": "transit_timestamp",
    "datetime_format": "%m/%d/%Y %I:%M:%S %p",
    "series_id_column": "station_complex_id",
    "target_column": "ridership",
    "target_alias": "flow",
    "aggregation": "sum",
    "filters": {
      "transit_mode": "subway"
    },
    "feature_columns": [
      "flow",
      "tod_sin",
      "tod_cos",
      "dow_sin",
      "dow_cos"
    ],
    "time_grid": "full_day",
    "chunksize": 500000
  },
  "debug": {
    "enabled": false
  },
  "yearly_cache": {
    "cache_dir": "data/cache/mta_subway_yearly_full",
    "station_selection": "all"
  },
  "task_stream": {
    "strategy": "yearly_periods",
    "split_ratio": {
      "train": 0.6,
      "val": 0.2,
      "test": 0.2
    }
  },
  "window": {
    "input_length": 12,
    "horizon": 12,
    "stride": 1,
    "input_columns": [
      "flow",
      "tod_sin",
      "tod_cos",
      "dow_sin",
      "dow_cos"
    ],
    "target_column": "flow",
    "fill_method": "ffill_zero",
    "fill_value": 0.0
  }
}
