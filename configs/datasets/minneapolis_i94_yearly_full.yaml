{
  "dataset": {
    "name": "minneapolis_i94",
    "adapter": "csv_long",
    "raw_path": "data/raw/Metro_Interstate_Traffic_Volume.csv",
    "freq": "1h",
    "timestamp_column": "date_time",
    "single_series_id": "i94",
    "target_column": "traffic_volume",
    "target_alias": "flow",
    "aggregation": "mean",
    "feature_columns": [
      "flow",
      "tod_sin",
      "tod_cos",
      "dow_sin",
      "dow_cos"
    ],
    "time_grid": "full_day",
    "chunksize": 250000
  },
  "debug": {
    "enabled": false
  },
  "yearly_cache": {
    "cache_dir": "data/cache/minneapolis_i94_yearly_full",
    "station_selection": "all"
  },
  "task_stream": {
    "strategy": "yearly_periods",
    "split_ratio": {
      "train": 0.6,
      "val": 0.2,
      "test": 0.2
    }
  },
  "window": {
    "input_length": 12,
    "horizon": 12,
    "stride": 1,
    "input_columns": [
      "flow",
      "tod_sin",
      "tod_cos",
      "dow_sin",
      "dow_cos"
    ],
    "target_column": "flow",
    "fill_method": "ffill_zero",
    "fill_value": 0.0
  }
}
